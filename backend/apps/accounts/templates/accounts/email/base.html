<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Liteseed Design{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f5f2ea;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f2ea;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border:1px solid #e1dccf;border-radius:12px;">
            <tr>
              <td style="padding:28px 32px 0 32px;">
                <img src="{{ site_url }}/icons/liteseed-wordmark-600.png" width="150" alt="Liteseed Design" style="display:block;width:150px;height:auto;border:0;">
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;color:#1f3a2e;">
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
          <p style="max-width:520px;margin:16px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#4c5c54;text-align:center;">
            You are receiving this because someone used your email address on Liteseed Design. If that was not you, you can ignore this message.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
